<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion Hospitalière</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
    --clr-bg:          #d8e5ee;        
    --clr-surface:     #ffffff;        
    --clr-primary:     #1a6fa8;       
    --clr-primary-dk:  #134f7a;       
    --clr-accent:      #e8f4fd;        
    --clr-danger:      #d94f3d;        
    --clr-danger-dk:   #b03325;        
    --clr-success:     #2e9e6b;        
    --clr-warning:     #d4870a;        
    --clr-text:        #1c2b3a;       
    --clr-muted:       #6b7e90;       
    --clr-border:      #dce4ec;       
    --clr-tab-active:  #1a6fa8;       
    --clr-tab-bg:      #e4edf5;     
    --clr-thead:       #eaf2fa;     
    --radius:          12px;          
    --radius-sm:       8px;           
    --shadow:          0 2px 16px rgba(26,111,168,.10);
    --shadow-hover:    0 6px 24px rgba(26,111,168,.18);
    --transition:      .2s ease;
    --font-body:       'DM Sans', sans-serif;
    --font-title:      'DM Serif Display', serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: var(--clr-bg);
    font-family: var(--font-body);
    color: var(--clr-text);
    min-height: 100vh;
}
.app-header {
    background: var(--clr-primary);
    color: #ccc;
    padding: 22px 50px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
}
.app-header .icon { font-size: 2rem; line-height: 1; }
.app-header h1 {
    font-family: var(--font-title);
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: .1em;
}
.app-body { max-width: 1200px; margin: 0 auto; padding: 32px 20px 60px; }

.tabs { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }

.tab-btn {
    padding: 9px 20px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--clr-tab-bg);
    color: var(--clr-muted);
    font-family: var(--font-body);
    font-size: .9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background var(--transition), color var(--transition), box-shadow var(--transition);
}
.tab-btn:hover { background: var(--clr-accent); color: var(--clr-primary); }
.tab-btn.active {
    background: var(--clr-tab-active);
    color: #fff;
    box-shadow: 0 2px 8px rgba(26,111,168,.6);
}

.tab-pane { display: none; }
.tab-pane.active { display: block; animation: fadeIn .2s ease; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
}
.grid-2 { 
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 24px; 
}
@media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }

.card {
    background: var(--clr-surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
}
.card-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--clr-border);
    font-weight: 600;
    font-size: .95rem;
    color: var(--clr-primary);
    background: var(--clr-accent);
}
.card-body { padding: 20px; }


.data-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.data-table thead th {
    background: var(--clr-thead);
    color: var(--clr-muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: .75rem;
    letter-spacing: .06em;
    padding: 10px 12px;
    text-align: left;
}
.data-table tbody tr {
    border-bottom: 1px solid var(--clr-border);
    transition: background var(--transition);
}
.data-table tbody tr:last-child { border-bottom: none; }
.data-table tbody tr:hover { background: var(--clr-accent); }
.data-table td { padding: 10px 12px; vertical-align: middle; }


label {
    display: block;
    font-size: .82rem;
    font-weight: 600;
    color: var(--clr-muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: .04em;
}
.field { margin-bottom: 14px; }

input:not([type="checkbox"]):not([type="hidden"]),
select {
    width: 100%;
    padding: 9px 13px;
    border: 1.5px solid var(--clr-border);
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: .9rem;
    color: var(--clr-text);
    background: #fff;
    transition: border-color var(--transition), box-shadow var(--transition);
    outline: none;
}
input:focus, select:focus {
    border-color: var(--clr-primary);
    box-shadow: 0 0 0 3px rgba(26,111,168,.12);
}

.checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.checkbox-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--clr-primary); cursor: pointer; }
.checkbox-row label { margin: 0; text-transform: none; font-size: .9rem; font-weight: 500; letter-spacing: 0; }


.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: .88rem;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
}
.btn:active { transform: scale(.97); }

.btn-primary     { background: var(--clr-primary); color: #fff; }
.btn-primary:hover { background: var(--clr-primary-dk); box-shadow: var(--shadow-hover); }

.btn-secondary   { background: var(--clr-border); color: var(--clr-text); }
.btn-secondary:hover { background: #c8d4de; }

.btn-danger      { background: var(--clr-danger); color: #fff; }
.btn-danger:hover { background: var(--clr-danger-dk); }

.btn-success     { background: var(--clr-success); color: #fff; }
.btn-success:hover { background: #237a52; }

.btn-warning     { background: var(--clr-warning); color: #fff; }
.btn-warning:hover { background: #b06e06; }

.btn-sm          { padding: 5px 12px; font-size: .8rem; }

.btn-outline {
    background: transparent;
    border: 1.5px solid var(--clr-primary);
    color: var(--clr-primary);
}
.btn-outline:hover { background: var(--clr-accent); }

.btn-outline-danger {
    background: transparent;
    border: 1.5px solid var(--clr-danger);
    color: var(--clr-danger);
}
.btn-outline-danger:hover { background: #fdf0ee; }

.btn-row   { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.action-btns { display: flex; gap: 6px; }
.alert {
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: .88rem;
    margin-top: 14px;
}
.alert-success { background: #edf7f2; color: #1e6b47; border-left: 4px solid var(--clr-success); }
.alert-info    { background: #eaf4fd; color: #1a5c8a; border-left: 4px solid var(--clr-primary); }
.alert-error   { background: #fdf0ee; color: #8a2415; border-left: 4px solid var(--clr-danger); }
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
}
.stat-box {
    background: var(--clr-surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    text-align: center;
}
.stat-box .stat-value {
    font-family: var(--font-title);
    font-size: 2.4rem;
    color: var(--clr-primary);
}
.stat-box .stat-label {
    font-size: .78rem;
    color: var(--clr-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-top: 4px;
}
.stats-pre {
    background: var(--clr-bg);
    border-radius: var(--radius-sm);
    padding: 16px;
    font-size: .85rem;
    white-space: pre-wrap;
    color: var(--clr-text);
    line-height: 1.7;
}
#serviceDiv { display: none; }
.single-card { max-width: 560px; }
.badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 600;
}
.badge-chef   { background: var(--clr-primary); color: #fff; }
.badge-medecin { background: var(--clr-border); color: var(--clr-muted); }
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
    <span class="icon">🏥</span>
    <h1>Hopital Gestion </h1>
</header>

<div class="app-body">

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('patients', this)">Patients</button>
        <button class="tab-btn" onclick="switchTab('doctors',  this)">Médecins</button>
        <button class="tab-btn" onclick="switchTab('consult',  this)">Consultations</button>
        <button class="tab-btn" onclick="switchTab('supervise',this)">Supervision</button>
        <button class="tab-btn" onclick="switchTab('stats',    this)">Statistiques</button>
    </div>

<!-- ===== PATIENTS ===== -->
<div class="tab-pane active" id="tab-patients">
    <div class="grid-2">
        <div class="card">
            <div class="card-header">Liste des patients</div>
            <div class="card-body" style="padding:0">
                <table class="data-table" id="patientsTable">
                    <thead>
                        <tr>
                            <th>Name</th><th>Age</th><th>Dossier</th>
                            <th>Maladie</th><th>phone</th><th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

<div class="card">
    <div class="card-header">ADD / Modify</div>
    <div class="card-body">
        <input type="hidden" id="editDossier">
        <div class="field"><label>Name</label><input id="p_nom"></div>
        <div class="field"><label>Age</label><input id="p_age" type="number"></div>
        <div class="field"><label>N° Dossier</label><input id="p_dossier"></div>
        <div class="field"><label>phone</label><input id="p_telephone"></div>
        <div class="field"><label>Maladie</label><input id="p_maladie"></div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="addOrUpdatePatient()">💾 Enregistrer</button>
            <button class="btn btn-secondary" onclick="clearPatientForm()">✕ Effacer</button>
        </div>
    </div>
</div>
</div>
</div>

<!-- ===== DOCTORS ===== -->
<div class="tab-pane" id="tab-doctors">
    <div class="grid-2">
        <div class="card">
            <div class="card-header">Liste des médecins</div>
            <div class="card-body" style="padding:0">
                <table class="data-table" id="doctorsTable">
                    <thead>
                        <tr>
                            <th>Nom</th><th>Âge</th><th>Spécialité</th>
                            <th>Consult.</th><th>Type</th><th>Service</th><th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="card">
            
        <div class="card-header">Ajouter / Modifier</div>
        <div class="card-body">
            <input type="hidden" id="editDoctorIdx">
            <div class="field"><label>Nom</label><input id="d_nom"></div>
            <div class="field"><label>Âge</label><input id="d_age" type="number"></div>
            <div class="field"><label>Spécialité</label><input id="d_specialite"></div>
            <div class="checkbox-row">
                <input type="checkbox" id="d_isChef" onchange="toggleServiceField()">
                <label for="d_isChef">Médecin Chef</label>
            </div>
            <div class="field" id="serviceDiv">
                <label>Service</label><input id="d_service">
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="addOrUpdateDoctor()">💾 Enregistrer</button>
                <button class="btn btn-secondary" onclick="clearDoctorForm()">✕ Effacer</button>
           </div>
         </div>
       </div>
     </div>
    </div>
        <!-- ===== CONSULTATIONS ===== -->
        <div class="tab-pane" id="tab-consult">
            <div class="card single-card">
                <div class="card-header">Effectuer une consultation</div>
                <div class="card-body">
                    <div class="field"><label>Médecin</label><select id="consultDoctor"></select></div>
                    <div class="field"><label>Patient</label><select id="consultPatient"></select></div>
                    <button class="btn btn-success" onclick="performConsultation()">▶ Consulter</button>
                    <div id="consultResult"></div>
                </div>
            </div>
        </div>

        <!-- ===== SUPERVISION ===== -->
        <div class="tab-pane" id="tab-supervise">
            <div class="card single-card">
                <div class="card-header">Supervision par un Chef</div>
                <div class="card-body">
                    <div class="field"><label>Médecin Chef</label><select id="superChef"></select></div>
                    <div class="field"><label>Médecin à superviser</label><select id="superDoctor"></select></div>
                    <button class="btn btn-warning" onclick="performSupervision()">▶ Superviser</button>
                    <div id="superResult"></div>
                </div>
            </div>
        </div>

        <!-- ===== STATS ===== -->
        <div class="tab-pane" id="tab-stats">
            <div class="stats-grid" id="statsBoxes"></div>
            <div class="card">
                <div class="card-header">Détail</div>
                <div class="card-body">
                    <pre class="stats-pre" id="statsContent"></pre>
                </div>
            </div>
        </div>

    </div>
    
    <!-- src : js -->
     <script>function switchTab(name, btn) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
    if (name === 'stats') loadStats();
}

async function fetchJSON(url, options = {}) {
    const res = await fetch(url, options);
    if (!res.ok) throw new Error(await res.text());
    return res.json();
}
function showError(msg) { alert('Erreur : ' + msg); }

async function loadPatients() {
    const data = await fetchJSON('/api/patients');
    const tbody = document.querySelector('#patientsTable tbody');
    tbody.innerHTML = '';
    if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--clr-muted)">Aucun patient enregistré</td></tr>';
        return;
    }
    data.forEach(p => {
        const row = tbody.insertRow();
        row.insertCell(0).innerText = p.nom;
        row.insertCell(1).innerText = p.age;
        row.insertCell(2).innerText = p.numero_dossier;
        row.insertCell(3).innerText = p.maladie;
        row.insertCell(4).innerText = p.telephone || '—';
        const c = row.insertCell(5);
        c.className = 'action-btns';

        const eBtn = document.createElement('button');
        eBtn.innerText = 'Modifier';
        eBtn.className = 'btn btn-sm btn-outline';
        eBtn.onclick = () => fillPatientForm(p);

        const dBtn = document.createElement('button');
        dBtn.innerText = 'Supprimer';
        dBtn.className = 'btn btn-sm btn-outline-danger';
        dBtn.onclick = async () => {
            if (confirm('Supprimer ce patient ?')) {
                await fetchJSON(`/api/patients/${p.numero_dossier}`, { method: 'DELETE' });
                loadPatients();
            }
        };
        c.appendChild(eBtn);
        c.appendChild(dBtn);
    });
}

function clearPatientForm() {
    ['editDossier','p_nom','p_age','p_dossier','p_telephone','p_maladie']
        .forEach(id => document.getElementById(id).value = '');
}

function fillPatientForm(p) {
    document.getElementById('editDossier').value   = p.numero_dossier;
    document.getElementById('p_nom').value         = p.nom;
    document.getElementById('p_age').value         = p.age;
    document.getElementById('p_dossier').value     = p.numero_dossier;
    document.getElementById('p_telephone').value   = p.telephone || '';
    document.getElementById('p_maladie').value     = p.maladie;
}

async function addOrUpdatePatient() {
    const editDossier = document.getElementById('editDossier').value;
    const data = {
        nom:            document.getElementById('p_nom').value,
        age:            parseInt(document.getElementById('p_age').value),
        numero_dossier: document.getElementById('p_dossier').value,
        maladie:        document.getElementById('p_maladie').value,
        telephone:      document.getElementById('p_telephone').value
    };
    try {
        if (editDossier) {
            await fetchJSON(`/api/patients/${editDossier}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        } else {
            await fetchJSON('/api/patients', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }
        loadPatients();
        clearPatientForm();
    } catch (e) { showError(e.message); }
}

async function loadDoctors() {
    const data = await fetchJSON('/api/doctors');
    const tbody = document.querySelector('#doctorsTable tbody');
    tbody.innerHTML = '';
    if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--clr-muted)">Aucun médecin enregistré</td></tr>';
        return;
    }
    data.forEach((d, idx) => {
        const row = tbody.insertRow();
        row.insertCell(0).innerText = d.nom;
        row.insertCell(1).innerText = d.age;
        row.insertCell(2).innerText = d.specialite;
        row.insertCell(3).innerText = d.consultations;
        row.insertCell(4).innerHTML = d.type === 'chef'
            ? '<span class="badge badge-chef">Chef</span>'
            : '<span class="badge badge-medecin">Médecin</span>';
        row.insertCell(5).innerText = d.service || '—';
        const c = row.insertCell(6);
        c.className = 'action-btns';

        const eBtn = document.createElement('button');
        eBtn.innerText = 'Modifier';
        eBtn.className = 'btn btn-sm btn-outline';
        eBtn.onclick = () => fillDoctorForm(d, idx);

        const dBtn = document.createElement('button');
        dBtn.innerText = 'Supprimer';
        dBtn.className = 'btn btn-sm btn-outline-danger';
        dBtn.onclick = async () => {
            if (confirm('Supprimer ce médecin ?')) {
                await fetchJSON(`/api/doctors/${idx}`, { method: 'DELETE' });
                loadDoctors();
                refreshConsultAndSupervise();
            }
        };
        c.appendChild(eBtn);
        c.appendChild(dBtn);
    });
}

function toggleServiceField() {
    document.getElementById('serviceDiv').style.display =
        document.getElementById('d_isChef').checked ? 'block' : 'none';
}

function clearDoctorForm() {
    ['editDoctorIdx','d_nom','d_age','d_specialite','d_service']
        .forEach(id => document.getElementById(id).value = '');
    document.getElementById('d_isChef').checked = false;
    toggleServiceField();
}

function fillDoctorForm(d, idx) {
    document.getElementById('editDoctorIdx').value = idx;
    document.getElementById('d_nom').value         = d.nom;
    document.getElementById('d_age').value         = d.age;
    document.getElementById('d_specialite').value  = d.specialite;
    const isChef = d.type === 'chef';
    document.getElementById('d_isChef').checked    = isChef;
    document.getElementById('d_service').value     = isChef ? d.service : '';
    toggleServiceField();
}

async function addOrUpdateDoctor() {
    const idx = document.getElementById('editDoctorIdx').value;
    const data = {
        nom:        document.getElementById('d_nom').value,
        age:        parseInt(document.getElementById('d_age').value),
        specialite: document.getElementById('d_specialite').value,
        type:       document.getElementById('d_isChef').checked ? 'chef' : 'medecin',
        service:    document.getElementById('d_service').value
    };
    try {
        if (idx !== '') {
            await fetchJSON(`/api/doctors/${idx}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
            });
        } else {
            await fetchJSON('/api/doctors', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
            });
        }
        loadDoctors();
        clearDoctorForm();
        refreshConsultAndSupervise();
    } catch (e) { showError(e.message); }
}

async function refreshConsultAndSupervise() {
    const patients = await fetchJSON('/api/patients');
    const doctors  = await fetchJSON('/api/doctors');

    document.getElementById('consultDoctor').innerHTML =
        doctors.map((d, i) => `<option value="${i}">${d.nom} (${d.specialite})</option>`).join('');
    document.getElementById('consultPatient').innerHTML =
        patients.map((p, i) => `<option value="${i}">${p.nom} — ${p.maladie}</option>`).join('');

    document.getElementById('superChef').innerHTML =
        doctors.map((d, i) => ({d, i})).filter(({d}) => d.type === 'chef')
            .map(({d, i}) => `<option value="${i}">${d.nom} (${d.specialite})</option>`).join('');
    document.getElementById('superDoctor').innerHTML =
        doctors.map((d, i) => ({d, i})).filter(({d}) => d.type !== 'chef')
            .map(({d, i}) => `<option value="${i}">${d.nom} (${d.specialite})</option>`).join('');
}

async function performConsultation() {
    const docIdx = document.getElementById('consultDoctor').value;
    const patIdx = document.getElementById('consultPatient').value;
    if (docIdx === '' || patIdx === '') return;
    try {
        const res = await fetchJSON('/api/consult', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ doctor_idx: parseInt(docIdx), patient_idx: parseInt(patIdx) })
        });
        document.getElementById('consultResult').innerHTML =
            `<div class="alert alert-success">${res.message}</div>`;
        loadDoctors();
    } catch (e) { showError(e.message); }
}

async function performSupervision() {
    const chefIdx = document.getElementById('superChef').value;
    const docIdx  = document.getElementById('superDoctor').value;
    if (chefIdx === '' || docIdx === '') return;
    try {
        const res = await fetchJSON('/api/supervise', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chef_idx: parseInt(chefIdx), doctor_idx: parseInt(docIdx) })
        });
        document.getElementById('superResult').innerHTML =
            `<div class="alert alert-info">${res.message}</div>`;
    } catch (e) { showError(e.message); }
}

async function loadStats() {
    const s = await fetchJSON('/api/stats');
    document.getElementById('statsBoxes').innerHTML = `
        <div class="stat-box">
            <div class="stat-value">${s.total_patients}</div>
            <div class="stat-label">Patients</div>
        </div>
        <div class="stat-box">
            <div class="stat-value">${s.total_doctors}</div>
            <div class="stat-label">Médecins</div>
        </div>
        <div class="stat-box">
            <div class="stat-value">${s.chefs}</div>
            <div class="stat-label">Chefs de service</div>
        </div>
    `;
    document.getElementById('statsContent').innerText =
`Médecins :
${s.doctors_detail.join('\n') || '—'}

Derniers patients :
${s.recent_patients.join('\n') || '—'}`;
}

async function init() {
    await loadPatients();
    await loadDoctors();
    await refreshConsultAndSupervise();
    await loadStats();
}

init();
</script>
